<section class="local-files" aria-label="Archivo de trabajo">
  <div><strong>Archivo de trabajo</strong><span id="local-status" role="status"></span></div>
  <div class="inline">
    <button id="local-new" class="secondary" type="button">Nueva base</button>
    <button id="local-open" class="secondary" type="button">Abrir JSON</button>
    <button class="primary" type="button" data-save-local>Guardar JSON</button>
    <input id="local-open-input" type="file" accept=".json,application/json" aria-label="Seleccionar archivo JSON de Aurora" hidden>
  </div>
</section>
<noscript><p class="noscript-local">Activa JavaScript en el navegador para abrir y gestionar los archivos de Aurora.</p></noscript>
